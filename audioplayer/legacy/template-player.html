<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROKKO Records - Template Audio Player</title>
    <link rel="stylesheet" href="template-player.css">
</head>
<body>
    <!-- Test Button to Open Player -->
    <button id="openPlayerBtn" class="open-player-btn">🎵 Player öffnen</button>

    <!-- Full Page Player Overlay -->
    <div id="playerOverlay" class="player-overlay" style="display: none;">
        <!-- Close Button (Top Right) -->
        <button id="closePlayerBtn" class="close-btn" aria-label="Player schließen" title="Schließen">✕</button>

        <!-- Player Container with Template Background -->
        <div class="player-container">
            <!-- Template Background Image -->
            <img src="player_template.png" alt="" class="template-bg">

            <!-- Interactive Layer - All clickable/dynamic elements -->
            <div class="interactive-layer">
                <!-- Album Cover (Top Left) -->
                <div class="album-cover-area">
                    <img id="albumCover" src="assets/cover1.jpg" alt="Album Cover">
                </div>

                <!-- Track Info (Top Right) -->
                <div class="track-info-area">
                    <h2 id="trackTitle">SkaRamush Vandango</h2>
                    <p id="trackArtist">Neurocentric</p>
                </div>

                <!-- Time Display (Right Side) -->
                <div class="time-display-area">
                    <span id="currentTime">0:00</span>/<span id="duration">0:00</span>
                </div>

                <!-- Progress Bar -->
                <div id="progressBarArea" 
                     class="progress-bar-area"
                     role="slider"
                     aria-label="Seek"
                     aria-valuemin="0"
                     aria-valuemax="100"
                     aria-valuenow="0"
                     tabindex="0">
                    <div id="progressIndicator" class="progress-indicator"></div>
                </div>

                <!-- Control Buttons -->
                <button id="prevBtn" class="control-btn prev-btn" aria-label="Previous Track" title="Previous"></button>
                <button id="playBtn" class="control-btn play-btn" aria-label="Play" title="Play/Pause"></button>
                <button id="nextBtn" class="control-btn next-btn" aria-label="Next Track" title="Next"></button>

                <!-- Playlist (Bottom Left) -->
                <div id="playlistArea" class="playlist-area">
                    <!-- Generated by JavaScript -->
                </div>

                <!-- Streaming Buttons (Bottom Right) -->
                <div class="streaming-buttons-area">
                    <button class="streaming-btn" aria-label="Listen on Spotify" title="Spotify">
                        <img src="../img/logo_01.png" alt="Spotify">
                    </button>
                    <button class="streaming-btn" aria-label="Listen on Beatport" title="Beatport">
                        <img src="../img/logo_02.png" alt="Beatport">
                    </button>
                    <button class="streaming-btn" aria-label="Listen on Apple Music" title="Apple Music">
                        <img src="../img/logo_03.png" alt="Apple Music">
                    </button>
                    <button class="streaming-btn" aria-label="Listen on SoundCloud" title="SoundCloud">
                        <img src="../img/logo_04.png" alt="SoundCloud">
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioElement" preload="metadata"></audio>

    <script src="template-player.js"></script>
</body>
</html>
