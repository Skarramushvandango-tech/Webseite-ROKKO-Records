<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100" height="200">
  <defs>
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Pivot point -->
  <circle cx="50" cy="20" r="8" fill="#3D2817" stroke="#201613" stroke-width="2"/>
  <!-- Arm body -->
  <rect x="45" y="20" width="10" height="140" fill="url(#armGrad)" rx="5"/>
  <!-- Cartridge/stylus -->
  <ellipse cx="50" cy="165" rx="12" ry="15" fill="#505050"/>
  <path d="M 50 180 L 45 195 L 55 195 Z" fill="#d77014"/>
</svg>
