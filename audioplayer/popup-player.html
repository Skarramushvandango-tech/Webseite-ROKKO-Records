<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROKKO Records - Audio Player</title>
    <link rel="stylesheet" href="image-player.css">
</head>
<body>
    <!-- Trigger Button (for testing) -->
    <button id="openPlayerBtn" class="open-player-btn">🎵 Player öffnen</button>

    <!-- Full Page Popup Player Overlay -->
    <div id="playerOverlay" class="player-overlay" style="display: none;">
        <!-- Close Button -->
        <button id="closePlayerBtn" class="close-btn" aria-label="Player schließen" title="Schließen">
            <svg viewBox="0 0 24 24" fill="currentColor" width="32" height="32">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>

        <!-- Player Container with Template Background -->
        <div class="player-content">
            <!-- Background Image -->
            <img src="player_template.png" alt="Player Design" class="player-background">
            
            <!-- Interactive Overlay Elements -->
            <div class="player-overlay-elements">
                <!-- Cover Art Overlay -->
                <div class="cover-overlay" id="coverOverlay">
                    <img id="coverArt" 
                         src="assets/cover-placeholder.jpg" 
                         alt="Album Cover"
                         onerror="this.style.opacity='0'">
                </div>
                
                <!-- Track Info Overlay -->
                <div class="info-overlay">
                    <h2 id="trackTitle" class="track-title">Track 1 - Sample</h2>
                    <p id="trackArtist" class="track-artist">ROKKO Artist</p>
                    <p id="trackTime" class="track-time">0:00 / 0:00</p>
                </div>
                
                <!-- Progress Bar Hotspot -->
                <div class="progress-hotspot" 
                     id="progressHotspot"
                     role="slider"
                     aria-label="Song position"
                     aria-valuemin="0"
                     aria-valuemax="100"
                     aria-valuenow="0"
                     tabindex="0">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                
                <!-- Control Buttons Hotspots -->
                <button id="prevBtn" 
                        class="control-hotspot prev-hotspot" 
                        aria-label="Vorheriger Track"
                        title="Zurück">
                </button>
                
                <button id="playPauseBtn" 
                        class="control-hotspot play-hotspot" 
                        aria-label="Play"
                        title="Abspielen">
                </button>
                
                <button id="nextBtn" 
                        class="control-hotspot next-hotspot" 
                        aria-label="Nächster Track"
                        title="Weiter">
                </button>
                
                <!-- Playlist Items Hotspots (clickable areas over the song list) -->
                <div class="playlist-hotspots" id="playlistHotspots">
                    <!-- Dynamically generated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audioElement" preload="metadata"></audio>
    
    <script src="image-player.js"></script>
</body>
</html>
