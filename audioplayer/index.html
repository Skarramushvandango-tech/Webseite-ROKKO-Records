<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROKKO Records Audio Player</title>
    <link rel="stylesheet" href="audioplayer.css">
</head>
<body>
    <div class="page-container">
        <header>
            <h1>ROKKO Records Audio Player</h1>
        </header>
        
        <main>
            <!-- Audio Player Container -->
            <div class="audio-player-container">
                <div class="audio-player">
                    <!-- Album Art Section -->
                    <div class="album-art-section">
                        <div class="album-art-wrapper">
                            <img id="albumArt" src="assets/placeholder-cover.svg" alt="Album Cover" class="album-art">
                            <div class="album-art-overlay">
                                <div class="now-playing-indicator">
                                    <span class="equalizer-bar"></span>
                                    <span class="equalizer-bar"></span>
                                    <span class="equalizer-bar"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Track Info Section -->
                    <div class="track-info-section">
                        <div class="track-details">
                            <h2 id="trackTitle" class="track-title">Track Title</h2>
                            <p id="trackArtist" class="track-artist">Artist Name</p>
                        </div>
                        
                        <!-- Progress Bar -->
                        <div class="progress-container">
                            <span id="currentTime" class="time-display">0:00</span>
                            <div class="progress-bar-wrapper">
                                <div class="progress-bar">
                                    <div id="progressFill" class="progress-fill"></div>
                                    <input 
                                        type="range" 
                                        id="seekBar" 
                                        class="seek-bar" 
                                        min="0" 
                                        max="100" 
                                        value="0"
                                        aria-label="Seek through track"
                                    >
                                </div>
                            </div>
                            <span id="duration" class="time-display">0:00</span>
                        </div>
                        
                        <!-- Controls -->
                        <div class="controls-section">
                            <button id="prevBtn" class="control-btn" aria-label="Previous track">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                                </svg>
                            </button>
                            
                            <button id="playPauseBtn" class="control-btn control-btn-main" aria-label="Play/Pause">
                                <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                                <svg id="pauseIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                                </svg>
                            </button>
                            
                            <button id="nextBtn" class="control-btn" aria-label="Next track">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M16 18h2V6h-2zm-11-6l8.5-6v12z"/>
                                </svg>
                            </button>
                            
                            <div class="volume-control">
                                <button id="volumeBtn" class="control-btn control-btn-small" aria-label="Mute/Unmute">
                                    <svg id="volumeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                                    </svg>
                                    <svg id="muteIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                                        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                                    </svg>
                                </button>
                                <input 
                                    type="range" 
                                    id="volumeSlider" 
                                    class="volume-slider" 
                                    min="0" 
                                    max="100" 
                                    value="70"
                                    aria-label="Volume control"
                                >
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Playlist Section -->
                <div class="playlist-section">
                    <h3 class="playlist-title">Playlist</h3>
                    <div id="playlistContainer" class="playlist-container">
                        <!-- Playlist items will be dynamically generated -->
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>ROKKO Records Audio Player - Test Page</p>
        </footer>
    </div>
    
    <!-- Hidden audio element -->
    <audio id="audioElement" preload="metadata"></audio>
    
    <script src="audioplayer.js"></script>
</body>
</html>
