<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROKKO Records - Audio Player</title>
    <link rel="stylesheet" href="audioplayer.css">
</head>
<body>
    <div class="player-container">
        <div class="audio-player" role="region" aria-label="Audio Player">
            <!-- Cover Art Display -->
            <div class="cover-art-container">
                <img id="coverArt" 
                     src="assets/cover-placeholder.jpg" 
                     alt="Album Cover" 
                     class="cover-art">
                <div class="track-info">
                    <h2 id="trackTitle" class="track-title">Select a track</h2>
                    <p id="trackArtist" class="track-artist">ROKKO Records</p>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="time-display">
                    <span id="currentTime" class="time">0:00</span>
                    <span id="duration" class="time">0:00</span>
                </div>
                <div class="progress-bar" 
                     role="slider" 
                     aria-label="Seek" 
                     aria-valuemin="0" 
                     aria-valuemax="100" 
                     aria-valuenow="0"
                     tabindex="0">
                    <div id="progress" class="progress"></div>
                    <div id="progressHandle" class="progress-handle"></div>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="controls">
                <button id="prevBtn" 
                        class="control-btn" 
                        aria-label="Previous Track"
                        title="Previous Track">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>
                
                <button id="playPauseBtn" 
                        class="control-btn play-btn" 
                        aria-label="Play"
                        title="Play">
                    <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                        <path d="M6 4h4v16H6zm8 0h4v16h-4z"/>
                    </svg>
                </button>
                
                <button id="nextBtn" 
                        class="control-btn" 
                        aria-label="Next Track"
                        title="Next Track">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M16 18h2V6h-2zm-11-7l8.5-6v12z"/>
                    </svg>
                </button>
            </div>

            <!-- Volume Control -->
            <div class="volume-container">
                <button id="muteBtn" 
                        class="volume-btn" 
                        aria-label="Mute"
                        title="Mute">
                    <svg id="volumeIcon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                    </svg>
                    <svg id="muteIcon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                    </svg>
                </button>
                <input type="range" 
                       id="volumeSlider" 
                       class="volume-slider" 
                       min="0" 
                       max="100" 
                       value="70"
                       aria-label="Volume">
            </div>

            <!-- Playlist Toggle -->
            <button id="playlistToggle" 
                    class="playlist-toggle" 
                    aria-label="Toggle Playlist"
                    aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/>
                </svg>
            </button>

            <!-- Playlist Panel -->
            <div id="playlistPanel" class="playlist-panel" aria-hidden="true">
                <h3 class="playlist-title">Playlist</h3>
                <ul id="playlist" class="playlist">
                    <!-- Playlist items will be populated by JavaScript -->
                </ul>
            </div>
        </div>
    </div>

    <audio id="audioElement" preload="metadata"></audio>
    
    <script src="audioplayer.js"></script>
</body>
</html>
